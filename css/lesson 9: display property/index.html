  <body>
    <!-- display = how an element is displayed on the page. 
                   block, inline, inline-block, none

         block-level = elements take up the full width of 
                       their parent container and start on a new line. 
                       Examples: <div>, <h1>, <p>

         inline = elements only take up as much width as necessary 
                  and do not start on a new line. 
                  Examples: <span>, <a>, <strong>

         inline-block = elements are similar to inline 
                        but can have a width and height set. Examples: <img>, <input>

         none = elements are not displayed. 
                Examples: <meta>, <link>, <script>
    -->

    <div>div</div>
    <span>span</span>
