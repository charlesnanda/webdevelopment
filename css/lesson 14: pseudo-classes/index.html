<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pseudo-Classes Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!--
            pseudo-classes = used to define a special state of an element
            1. :hover
            2. :focus
            3. :active
            4. :visited
            5. :first-child
            6. :last-child
            7. :nth-child()

            #greeting {
    background-color: lightblue;
    padding: 10px;
    display: none;
}
#greeting:hover {
    display: block;
}
        -->

        <div id="greeting"> Hover here to see a greeting! </div>
            <p>Hello, World!</p>
        </div>
        
  </body>
</html>
