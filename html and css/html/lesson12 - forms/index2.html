<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>

<body>

    <form action="index.php" method="POST">

        <!-- Username -->
        <label for="username">Username:</label>
        <input
            type="text"
            id="username"
            name="username"
            placeholder="kingcharles"
            minlength="6"
            maxlength="15"
            required
        >
        <br><br>


        <!-- Password -->
        <label for="password">Password:</label>
        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter password"
            minlength="8"
            required
        >
        <br><br>


        <!-- Email -->
        <label for="email">Email:</label>
        <input
            type="email"
            id="email"
            name="email"
            placeholder="kingcharles@example.com"
            required
        >
        <br><br>


        <!-- Phone Number -->
        <label for="phone">Phone Number:</label>
        <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="403-555-1234"
            required
        >
        <br><br>


        <!-- Title -->
        <label>Title:</label>

        <input
            type="radio"
            id="mr"
            name="title"
            value="Mr"
        >
        <label for="mr">Mr.</label>

        <input
            type="radio"
            id="mrs"
            name="title"
            value="Mrs"
        >
        <label for="mrs">Mrs.</label>

        <input
            type="radio"
            id="phd"
            name="title"
            value="PhD"
        >
        <label for="phd">PhD</label>

        <br><br>


        <!-- Payment -->
        <label for="payment">Payment:</label>

        <select id="payment" name="payment">

            <option value="visa">Visa</option>
            <option value="mastercard">Mastercard</option>
            <option value="giftcard">Gift Card</option>

        </select>

        <br><br>


        <!-- Subscribe -->
        <input
            type="checkbox"
            id="subscribe"
            name="subscribe"
        >

        <label for="subscribe">Subscribe</label>

        <br><br>


        <!-- Comment -->
        <label for="comment">Comment:</label>
        <br>

        <textarea
            id="comment"
            name="comment"
            rows="4"
            cols="30"
            placeholder="Write your comment..."
        ></textarea>

        <br><br>


        <!-- File -->
        <label for="file">File:</label>

        <input
            type="file"
            id="file"
            name="file"
        >

        <br><br>


        <!-- Buttons -->
        <input type="reset">

        <input type="submit">

    </form>

</body>

</html>
