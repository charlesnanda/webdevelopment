<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create an Account</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        form {
            background-color: white;
            padding: 30px;
            width: 350px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            font-size: 16px;
        }

        button {
            margin-top: 20px;
            padding: 10px 15px;
            font-size: 16px;
            cursor: pointer;
        }

        .buttons {
            display: flex;
            gap: 10px;
        }

        .buttons button {
            flex: 1;
        }
    </style>
</head>

<body>

    <form action="index.php" method="POST">

        <h1>Create Account</h1>

        <!-- Username -->
        <label for="username">Username</label>

        <input
            type="text"
            id="username"
            name="username"
            placeholder="kingcharles"
            minlength="6"
            maxlength="15"
            required
            autocomplete="username"
        >

        <!-- Password -->
        <label for="password">Password</label>

        <input
            type="password"
            id="password"
            name="password"
            minlength="8"
            required
            autocomplete="new-password"
        >

        <!-- Email -->
        <label for="email">Email</label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="kingcharles@outlook.com"
            required
            autocomplete="email"
        >

        <!-- Buttons -->
        <div class="buttons">
            <button type="reset">Reset</button>
            <button type="submit">Create Account</button>
        </div>

    </form>

</body>

</html>
